<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>&#9670;&#9670;&#9670;</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050507;
    --fg: #d6d6dc;
    --dim: #4a4a54;
    --faint: #24242b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
  }
  body {
    font-family: 'VT323', 'Courier New', monospace;
    font-size: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    text-align: center;
  }

  .glyphs {
    letter-spacing: 0.5em;
    color: var(--dim);
    margin-bottom: 2.5rem;
    animation: flicker 7s infinite;
  }

  @keyframes flicker {
    0%, 91%, 100% { opacity: 1; }
    92% { opacity: 0.25; }
    93% { opacity: 1; }
    94% { opacity: 0.15; }
    95% { opacity: 1; }
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 100%;
    max-width: 320px;
  }

  input {
    background: transparent;
    border: 1px solid var(--dim);
    color: var(--fg);
    font-family: inherit;
    font-size: 20px;
    padding: 0.6rem 0.8rem;
    outline: none;
  }
  input:focus { border-color: var(--fg); }
  input::placeholder { color: var(--dim); letter-spacing: 0.05em; }

  button {
    background: transparent;
    border: 1px solid var(--dim);
    color: var(--fg);
    font-family: inherit;
    font-size: 20px;
    padding: 0.6rem;
    cursor: pointer;
    letter-spacing: 0.2em;
  }
  button:hover:not(:disabled) { border-color: var(--fg); }
  button:disabled { opacity: 0.35; cursor: default; }

  #status {
    margin-top: 1.75rem;
    min-height: 1.4em;
    color: var(--dim);
  }

  .cf-turnstile { margin: 0.25rem 0; display: flex; justify-content: center; }

  footer {
    position: fixed;
    bottom: 0.6rem;
    font-size: 12px;
    color: var(--faint);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

  <div class="glyphs">&#9670; &#9670; &#9670;</div>

  <form id="arg-form" autocomplete="off">
    <input type="email" id="email" name="email" placeholder="email" required>
    <input type="text" id="response" name="response" placeholder="response" required>

    <!--
      Cloudflare Turnstile (free bot check) — replace YOUR_TURNSTILE_SITE_KEY
      below with the site key from your Cloudflare dashboard. If you don't
      want it, delete this div and the two <script> lines that reference
      Turnstile, then remove the "disabled" attribute from the button below.
      See the README for why this is worth keeping if the link ever leaves
      a small trusted group.
    -->
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAEa2ovVrcqQ7_xo6" data-callback="onTurnstileSuccess"></div>

    <button type="submit" id="submit-btn" disabled>enter</button>
  </form>

  <div id="status" aria-live="polite"></div>



  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    let turnstileToken = null;

    function onTurnstileSuccess(token) {
      turnstileToken = token;
      document.getElementById('submit-btn').disabled = false;
    }

    const form = document.getElementById('arg-form');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const response = document.getElementById('response').value.trim();

      submitBtn.disabled = true;
      statusEl.textContent = '. . .';

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, response, turnstileToken }),
        });
        const data = await res.json();

        statusEl.textContent = data.ok ? 'check your email.' : '. . .';
      } catch (err) {
        statusEl.textContent = 'Very interesting indeed.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
